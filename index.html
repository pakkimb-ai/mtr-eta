<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef6ff" />
  <title>附近港鐵站 · 到站時間</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>附近港鐵站 · 到站時間</h1>
      <p class="tagline">定位搵最近車站，即時睇下一班車還有幾多分鐘</p>
    </header>

    <div class="toolbar">
      <button type="button" id="btnLocate">重新定位</button>
      <button type="button" id="btnRefresh" class="secondary">立即刷新</button>
      <select id="stationSelect" aria-label="手動選擇車站"></select>
    </div>

    <div id="geoStatus" class="geo-status info" role="status">載入中…</div>

    <div class="station-panel">
      <h2 id="stationTitle">—</h2>
      <div id="stationMeta" class="station-meta"></div>
    </div>

    <div id="delayBanner" hidden>⚠ 系統標示列車可能延誤（Isdelay = Y）</div>

    <main id="etaRoot" aria-live="polite"></main>
    <p id="lastUpdated" class="footer-meta"></p>

    <p class="hint">
      資料來源：港鐵 Next Train 開放數據（data.gov.hk）。約每 18 秒自動刷新。
      GPS 喺室外／站外較準；若你喺站外附近，頁面會以「分鐘」為主顯示下一班車，方便你決定加快腳步定慢慢行。
      收車時段可能冇班次。定位需瀏覽器權限；唔准定位亦可手動揀站。
    </p>
  </div>

  <script src="js/stations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
